<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Milaine Bot</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#FFE4F1"/>
      <stop offset="55%" stop-color="#F5B8D8"/>
      <stop offset="100%" stop-color="#B9A2EE"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF4C7"/>
      <stop offset="60%" stop-color="#F3D88A"/>
      <stop offset="100%" stop-color="#E2BD62"/>
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="55%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
    <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C5CDB"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE58A"/>
      <stop offset="100%" stop-color="#E0A526"/>
    </linearGradient>
    <clipPath id="circle"><circle cx="256" cy="256" r="256"/></clipPath>
  </defs>

  <g clip-path="url(#circle)">
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- floating music notes and sparkles -->
    <g fill="#FFFFFF" opacity="0.85">
      <g transform="translate(70 120) rotate(-12)">
        <ellipse cx="0" cy="34" rx="13" ry="10"/>
        <rect x="9" y="-8" width="5" height="42"/>
        <path d="M14 -8 C 30 -2 34 8 28 20 C 30 10 24 4 14 4 Z"/>
      </g>
      <g transform="translate(418 96) rotate(10)">
        <ellipse cx="0" cy="30" rx="11" ry="8.5"/>
        <ellipse cx="34" cy="22" rx="11" ry="8.5"/>
        <rect x="8" y="-6" width="4.5" height="36"/>
        <rect x="42" y="-14" width="4.5" height="36"/>
        <path d="M8 -6 L46.5 -14 L46.5 -4 L8 4 Z"/>
      </g>
      <path d="M440 210 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6 z"/>
      <path d="M58 236 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z"/>
      <circle cx="110" cy="64" r="4"/>
      <circle cx="400" cy="290" r="3.5"/>
    </g>

    <!-- back hair -->
    <path fill="url(#hair)" d="M118 250 C 104 140 180 78 256 78 C 332 78 408 140 394 250 L 414 470 C 386 506 330 506 306 482 L 256 410 L 206 482 C 182 506 126 506 98 470 Z"/>

    <!-- body / dress -->
    <path fill="url(#dress)" d="M108 520 C 118 440 180 404 256 404 C 332 404 394 440 404 520 Z"/>
    <path fill="#FFFFFF" d="M196 418 C 220 406 240 404 256 404 C 272 404 292 406 316 418 L 256 468 Z"/>
    <path fill="#FCD34D" d="M248 440 l8 -8 8 8 -8 8 z"/>

    <!-- neck -->
    <path fill="#F6D2C2" d="M232 350 L280 350 L284 412 C 266 424 246 424 228 412 Z"/>

    <!-- face -->
    <ellipse cx="256" cy="262" rx="106" ry="114" fill="#FFE9DE"/>
    <ellipse cx="196" cy="320" rx="20" ry="11" fill="#FF9EBB" opacity="0.55"/>
    <ellipse cx="316" cy="320" rx="20" ry="11" fill="#FF9EBB" opacity="0.55"/>

    <!-- eyes -->
    <g id="eye-left">
      <ellipse cx="212" cy="284" rx="27" ry="33" fill="#FFFFFF"/>
      <ellipse cx="213" cy="288" rx="21" ry="28" fill="url(#iris)"/>
      <ellipse cx="213" cy="292" rx="9" ry="12" fill="#0F1E4D"/>
      <circle cx="205" cy="277" r="7" fill="#FFFFFF"/>
      <circle cx="221" cy="302" r="3.5" fill="#FFFFFF"/>
      <path d="M182 270 C 190 248 232 244 244 266" stroke="#5B3A29" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M182 270 L174 262" stroke="#5B3A29" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g id="eye-right">
      <ellipse cx="300" cy="284" rx="27" ry="33" fill="#FFFFFF"/>
      <ellipse cx="299" cy="288" rx="21" ry="28" fill="url(#iris)"/>
      <ellipse cx="299" cy="292" rx="9" ry="12" fill="#0F1E4D"/>
      <circle cx="291" cy="277" r="7" fill="#FFFFFF"/>
      <circle cx="307" cy="302" r="3.5" fill="#FFFFFF"/>
      <path d="M268 266 C 280 244 322 248 330 270" stroke="#5B3A29" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M330 270 L338 262" stroke="#5B3A29" stroke-width="4" stroke-linecap="round"/>
    </g>
    <!-- brows -->
    <path d="M192 236 Q 210 228 228 234" stroke="#C9A35A" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M284 234 Q 302 228 320 236" stroke="#C9A35A" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- mouth -->
    <path d="M244 336 Q 256 346 268 336" stroke="#C2566F" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- side locks framing the face -->
    <path fill="url(#hair)" d="M156 210 C 136 260 134 330 150 400 C 160 380 166 340 172 300 C 176 270 176 240 172 214 Z"/>
    <path fill="url(#hair)" d="M356 210 C 376 260 378 330 362 400 C 352 380 346 340 340 300 C 336 270 336 240 340 214 Z"/>

    <!-- bangs -->
    <path fill="url(#hair)" d="M146 250 C 140 160 196 112 256 112 C 316 112 372 160 366 250
      C 356 222 344 206 330 198 C 330 222 318 240 300 250
      C 304 224 296 202 282 190 C 276 214 262 232 244 242
      C 250 220 246 200 236 190 C 222 214 202 232 180 240
      C 186 226 182 212 174 206 C 160 218 150 232 146 250 Z"/>
    <path d="M200 150 C 220 132 250 126 276 130" stroke="#FFFBE6" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.8"/>

    <!-- headphones -->
    <path d="M142 262 C 132 118 380 118 370 262" stroke="#F472B6" stroke-width="18" fill="none" stroke-linecap="round"/>
    <path d="M142 262 C 132 118 380 118 370 262" stroke="#FBCFE8" stroke-width="6" fill="none" stroke-linecap="round"/>
    <rect x="114" y="236" width="46" height="84" rx="22" fill="#F472B6"/>
    <rect x="124" y="250" width="26" height="56" rx="13" fill="#FFFFFF"/>
    <rect x="352" y="236" width="46" height="84" rx="22" fill="#F472B6"/>
    <rect x="362" y="250" width="26" height="56" rx="13" fill="#FFFFFF"/>

    <!-- tiara -->
    <path fill="url(#gold)" stroke="#B7791F" stroke-width="3" stroke-linejoin="round"
      d="M206 132 L216 100 L234 120 L256 82 L278 120 L296 100 L306 132 C 274 124 238 124 206 132 Z"/>
    <circle cx="256" cy="112" r="8" fill="#60A5FA" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="225" cy="120" r="4" fill="#F9A8D4"/>
    <circle cx="287" cy="120" r="4" fill="#F9A8D4"/>
  </g>
</svg>
