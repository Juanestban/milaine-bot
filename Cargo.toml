[package]
name = "milaine-bot"
version = "0.1.0"
edition = "2024"
description = "A Discord music bot that plays YouTube audio in voice channels"
license = "MIT"
publish = false

[dependencies]
poise = "0.7"
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "model", "cache", "voice", "rustls_backend"] }
songbird = "0.6"
symphonia = { version = "0.5", features = ["aac", "mp3", "isomp4", "alac"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "process", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = "1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
